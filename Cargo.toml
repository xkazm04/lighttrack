[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/store-pg",
    "crates/store-firestore",
    "crates/engine",
    "crates/anon",
    "crates/render",
    "crates/billing",
    "crates/agent",
    "crates/api",
    "crates/runner",
    "crates/mcp",
    "crates/cli",
    "crates/responder",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xkazm04/lighttrack"

[workspace.dependencies]
lighttrack-core = { path = "crates/core" }
lighttrack-render = { path = "crates/render" }
lighttrack-billing = { path = "crates/billing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

# Declared for the crates that will need them as we evolve (kept out of the
# build until a crate actually depends on them, to keep `cargo build` fast):
#   tokio   = { version = "1", features = ["full"] }
#   axum    = "0.7"
#   tower   = "0.5"
#   rusqlite = { version = "0.32", features = ["bundled"] }
#   reqwest  = { version = "0.12", features = ["json"] }
#   clap     = { version = "4", features = ["derive"] }
#   anyhow   = "1"

# cargo-dist config (for `cargo dist init` adoption). Until then, .github/workflows/release.yml is a
# hand-rolled equivalent: native matrix build of the binaries → GitHub Release + curl|sh installer.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Dev builds carry line tables only, not full debug info.
#
# Measured 2026-08-25 on this machine: this workspace's `target/` held 11.06 GB,
# of which 866 MB of binaries plus 693 MB of incremental was MSVC `.pdb` debug symbols — a large share of the build tree, and
# the largest single class in it. Cargo's default for dev is `debug = true`,
# which on `x86_64-pc-windows-msvc` writes one complete packed PDB per binary,
# and a test-heavy workspace produces one binary per integration test file.
#
# `line-tables-only` keeps file:line in panic backtraces and `RUST_BACKTRACE`
# output — which is what CI, the test harness and any triage actually read.
# What it drops is variable and type inspection under a native debugger. If
# someone needs to attach WinDbg or rust-lldb to a binary here, raise this to
# `debug = 1` ("limited") for that session rather than deleting the line.
[profile.dev]
debug = "line-tables-only"
