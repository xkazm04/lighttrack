{{- /*
  The one invariant a chart policy in CI cannot enforce, because CI never sees `-f my-values.yaml`:
  SQLite is a single writer on a ReadWriteOnce volume, so more than one replica is only legal once
  state has moved to Postgres. Refuse the combination at RENDER time, where the operator's own
  values are in scope. `crates/core/tests/chart_policy_guard.rs` then checks that this guard is
  still here — CI's job shrinks to "the guard exists", which is the honest split.
*/ -}}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.secrets.databaseUrl) }}
{{- fail "replicaCount > 1 requires secrets.databaseUrl: SQLite at config.dbPath is one writer on a ReadWriteOnce volume, and a second pod corrupts the database. Set a Postgres DSN, or keep replicaCount: 1." }}
{{- end }}
{{- if and (ne .Values.updateStrategy "Recreate") (not .Values.secrets.databaseUrl) }}
{{- fail "updateStrategy must be Recreate without secrets.databaseUrl: a RollingUpdate overlaps the old and new pod on one ReadWriteOnce volume, which is the same two-writers-one-file failure for the length of a deploy." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lighttrack.fullname" . }}
  labels:
    {{- include "lighttrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy }}
  selector:
    matchLabels:
      {{- include "lighttrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lighttrack.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # This service calls no Kubernetes API. A mounted ServiceAccount token is a cluster credential
      # handed to a pod with no use for one, and the namespace default is what it would get.
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["lighttrack-api"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: LIGHTTRACK_BIND
              value: {{ .Values.config.bind | quote }}
            - name: LIGHTTRACK_AUTH_MODE
              value: {{ .Values.config.authMode | quote }}
            - name: LIGHTTRACK_DB
              value: {{ .Values.config.dbPath | quote }}
            - name: LIGHTTRACK_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lighttrack.fullname" . }}
                  key: admin-key
            {{- if .Values.secrets.databaseUrl }}
            - name: LIGHTTRACK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "lighttrack.fullname" . }}
                  key: database-url
            {{- end }}
          # One process, two answers, and they must not be the same answer. Both probes used to read
          # `/health`, which was a constant: the readiness probe was a liveness probe wearing a
          # readiness name, and the pod joined the Service the moment axum bound — cold store,
          # unfinished migration and all.
          #
          # startupProbe is what makes the two thresholds independent. Liveness does not begin until
          # this has passed once, so a long first migration (the app auto-migrates on startup when
          # handed a Postgres DSN — deploy/cloudrun/README.md) and a wedged steady-state process stop
          # competing for one number. Raise `probes.startup.failureThreshold` for a slow database;
          # nothing else needs to move.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          # Liveness asks "is this process wedged?" and reads the endpoint that observes NOTHING
          # outside the process. Pointing it at a dependency check makes a slow store a restart loop,
          # and the restart makes the store slower — the opposite remedy to the one the situation
          # wants.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # Readiness asks "should traffic arrive?" and reads the endpoint that round-trips the real
          # store. A red here removes the pod from the Service, which is the correct remedy for
          # "temporarily unable to serve" — and the only thing standing between a severed store and
          # clients collecting 5xx.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /data
          # Emitted unconditionally. Under `{{- with }}` an empty map produced NO resources block at
          # all — a BestEffort pod, silently, from a values file that looked like it said nothing.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lighttrack.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lighttrack.fullname" . }}
  labels:
    {{- include "lighttrack.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
