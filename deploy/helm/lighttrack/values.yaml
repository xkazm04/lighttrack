# LightTrack Helm values. Override with -f my-values.yaml or --set.
# UNVERIFIED template (authored without a local helm to lint) — run `helm lint` / `helm template`
# before installing.

# >1 is only legal with secrets.databaseUrl set. SQLite is ONE writer on a ReadWriteOnce volume;
# two pods are two writers on one file, and the failure is a corrupt database, not a scaling limit.
# templates/deployment.yaml refuses the combination at render time — this is not advice.
replicaCount: 1

# How a new pod replaces the old one. Recreate by default for the same reason: a RollingUpdate
# overlaps the old and new pod on one RWO volume, which is the two-writer failure for the length of
# a deploy rather than forever. RollingUpdate is correct ONLY with secrets.databaseUrl set.
updateStrategy: Recreate

image:
  repository: ghcr.io/xkazm04/lighttrack
  tag: "v0.0.4"
  pullPolicy: IfNotPresent

# imagePullSecrets: [{ name: ghcr-creds }]   # if the GHCR package is private

config:
  authMode: enforced          # "enforced" (recommended) or "dev"
  bind: "0.0.0.0:8787"
  dbPath: /data/lighttrack.db  # SQLite path; used only when secrets.databaseUrl is empty

secrets:
  adminKey: ""                 # REQUIRED for authMode=enforced (a strong random string)
  databaseUrl: ""              # postgres://... (Phase 5a). Empty => SQLite at config.dbPath.

# Keep SQLite across restarts. Not needed when databaseUrl points at Postgres.
persistence:
  enabled: false
  size: 1Gi
  # storageClass: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8787

ingress:
  enabled: false
  className: ""
  host: lighttrack.example.com
  annotations: {}
  tls: false
  # tlsSecretName: lighttrack-tls

# An empty map here is not "the defaults" — it is BestEffort QoS: first evicted under node pressure
# and unbounded on the way there, for a process that serves ingest and runs judge scoring. Both a
# request (so the scheduler can place it) and a limit (so it cannot take the node with it).
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: "1", memory: 512Mi }

# The image already builds and runs as uid 10001 (deploy/docker/Dockerfile) — this makes the cluster
# enforce it rather than trust it, and fsGroup is what keeps the mounted PVC writable by that uid.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# tracklight calls no Kubernetes API. Mounting the namespace default ServiceAccount's token hands a
# cluster credential to a pod that has no use for one.
automountServiceAccountToken: false

# Probes. The two kubelet consumers ask DIFFERENT questions and read DIFFERENT endpoints:
#   /health/live   is this process wedged?   -> a red RESTARTS the pod. Observes nothing outside the
#                                               process, so a slow or unreachable store can never
#                                               cause a restart loop.
#   /health/ready  should traffic arrive?    -> a red REMOVES the pod from the Service. Observes the
#                                               real store on every probe.
#   /health        the operator rollup       -> `ok`, or 503 naming the member that is red.
# The one number to raise for a slow database is `startup.failureThreshold`: startup × period is how
# long a first migration may take before the kubelet gives up (default 60 × 5s = 5 minutes), and
# liveness does not start counting until startup has passed once.
#
# NOTE: a NotReady pod is QUIET. Kubernetes will hold traffic off it indefinitely and page nobody.
# If this install has no alert on readiness, add one (docs/ALERTS.md is about limit breaches, not
# pod state — the signal here is `kube_pod_status_ready`/`kubectl get pod` and it belongs in
# whatever watches the cluster).
probes:
  startup:
    periodSeconds: 5
    failureThreshold: 60       # 5 minutes for a first migration against a cold or busy database
  liveness:
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
