# .ai/manifest.yaml — the agent-facing contract for this repo.
# Capabilities are tool-NEUTRAL (a name -> the command that fulfils it), heavy subsystems are
# referenced by path, and unknown fields MUST be ignored — so this survives tool churn and schema
# growth. THE CONTRACT SHIPS BESIDE THIS FILE: .ai/ai-manifest.spec.md defines every key below and
# what a conformant reader asserts about them. It used to say "the spec carried by the registry
# consumer lane" — a pointer that resolved from no clone, and named no document that existed
# anywhere. crates/core/tests/manifest_guard.rs holds this file to it on every `cargo test`.
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-24"
generatedFrom: [Cargo.toml, .github/workflows/ci.yml, CONTRIBUTING.md]

repo:
  name: tracklight
  purpose: "Self-hosted LLM observability + LLM-as-judge scoring/benchmark service (Rust workspace)"
  languages: [rust, typescript, python]
  archetype: service

# Capabilities, not tools. Add keys freely; older readers ignore unknown ones.
# `verified` is a claim a doctor flips to true once it has actually run the command.
# Every command below is one CI runs (.github/workflows/ci.yml) or one CONTRIBUTING.md documents.
capabilities:
  build: { command: "cargo build --workspace", verified: false }
  test: { command: "cargo test --workspace", verified: false }
  lint: { command: "cargo clippy --workspace --all-targets -- -D warnings", verified: false }
  typecheck: { command: "cargo check --workspace --all-targets", verified: false }
  format-check: { command: "cargo fmt --all -- --check", verified: false }
  conformance: { command: "cargo test -p lighttrack-store --test sqlite_conformance", verified: false }
  # `--locked` is a global flag and must precede the subcommand; `cargo deny check all --locked`
  # is rejected by cargo-deny 0.20 ("unexpected argument '--locked' found").
  audit-policy: { command: "cargo deny --locked check bans licenses sources", verified: true }
  audit-advisories: { command: "cargo deny --locked check advisories", verified: true }
  # Full-history secret scan. The engine is external and NOT assumed present: a machine without it
  # gets an announced skip locally (.githooks/pre-commit), while CI installs a pinned build and
  # blocks. Verified against gitleaks 8.30.1 over all 241 commits — clean.
  audit-secrets: { command: "gitleaks git . --config .gitleaks.toml --redact --no-banner", verified: true }
  # Same scan on the NEWEST upstream rules rather than the pinned engine — a detection pattern
  # published today should find a token pushed last spring. Advisory: its input moves without us.
  audit-secrets-latest-rules: { command: "gitleaks git . --config .gitleaks.toml --redact --no-banner  # with the latest gitleaks release installed", verified: false }
  # Policy over the deployment SHAPE, not over the code: what deploy/helm/lighttrack may never grant.
  # Text-level (no helm binary, no cluster), with must-fail fixtures beside every policy. This closes
  # the hole where the chart was the only shipped artifact no gate read.
  chart-policy: { command: "cargo test -p lighttrack-core --test chart_policy_guard", verified: true }
  smoke: { command: "sh scripts/smoke.sh http://127.0.0.1:8787", verified: false }
  # cargo test --workspace ranges over the root Cargo.toml members list, which excludes all three
  # detached client SDKs. Each ships to users and needs its own command.
  test-client-rust: { command: "cargo test --manifest-path clients/rust/Cargo.toml", verified: false }
  test-client-python: { command: "python -m pip install ./clients/python && python -m unittest discover -s clients/python/tests", verified: true }
  test-client-typescript: { command: "cd clients/typescript && npm ci && npm run build && npm test", verified: true }

# Pointers — these subsystems can change format underneath without breaking this contract.
paths:
  spec: .ai/ai-manifest.spec.md
  contextMap: context-map.json
  docs: docs/
  workingAgreement: CLAUDE.md
  contributing: CONTRIBUTING.md
  dependencyPolicy: deny.toml

boundaries:
  # Build output only. `Cargo.lock` used to be listed here, which read as "never change it" and so
  # forbade the one remediation path the advisory lane has — the `cargo update -p <crate>` that
  # answers a RUSTSEC finding. Corrected 2026-08-24: it is generated, never hand-edited, and changed
  # only by cargo (that is `generatedNotHandEdited` below).
  neverTouch: [target/]
  generatedNotHandEdited: [Cargo.lock, clients/typescript/package-lock.json]
  secretsFrom: ".env via dotenvy (git-ignored); the GitHub remote is PUBLIC — never commit an API key"
  # Where a leaked credential cannot pass: the blocking `gitleaks (secrets)` CI job (full history,
  # pinned engine). `.githooks/pre-commit` is the local rung and announces a skip when the engine is
  # absent, so it is a convenience, not the gate.
  secretScanning: { config: .gitleaks.toml, allowlist: .gitleaksignore, bindingRung: "gitleaks (secrets)" }

# The control model: where each capability is PRIMARILY enforced. `.github/workflows/ci.yml` is the
# authority; this is a projection of it and must be updated in the same change as the workflow.
# Everything below blocks except `audit-advisories`, which reads the RUSTSEC feed — an input that
# moves without this repository, so it can never be made green by work here and must not wall a PR.
controls:
  ciHardPass:
    [
      test,
      conformance,
      chart-policy,
      lint,
      format-check,
      audit-policy,
      test-client-rust,
      test-client-python,
      test-client-typescript,
      audit-secrets,
    ]
  # Both read an input that moves WITHOUT this repository — the RUSTSEC feed and gitleaks' upstream
  # rule set — so neither can be made green by work here and neither may wall a PR. Both run on the
  # Monday cron and are meant to be read.
  ciAdvisory: [audit-advisories, audit-secrets-latest-rules]

# The organization's AI registry — knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
# registered from the secondary machine (mkdol) 2026-08-24
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
  machine: secondary
  contributor: mkdol-dev-box
knowledge:
  domains: [software-engineering, llm-observability]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored); THIS list is the reviewable declaration. A skill not listed here is
# project-owned and lives in .claude/skills/ as a real directory.
skills:
  - architect
  - ci-triage
  - conform
  - consult
  - explorer
  - research
  - ship-loop
  - test-before-commit
  - tiger
  - mvp
  - perfect
  - scan-sweep

# Scope - what this project does and deliberately does not do. Read by the registry's
# scripts/build-fleet-map.mjs to classify subjects this project has NO context for: an
# absence inside an out-of-scope category or subject is never proposed as a new direction;
# every other in-domain absence is a `candidate` for the intake direction pass. Keys are
# `<bundle>/<category>[/<subcategory>]` and `<bundle>/<subject>`. Decisions on proposed
# directions live in .ai/directions/ledger.jsonl. DRAFT written by the registry on
# 2026-09-02 from the purpose line and the project note - the owner edits this block, the
# registry only reads it.
scope:
  does:
    - ingest LLM telemetry, score with judges, benchmark providers, serve an operator API
  does_not:
    - end-user product UI beyond an operator dashboard
    - agent runtime, companions or orchestration
    - localization, recruiting, media
  out_of_scope_categories:
    - software-engineering/ui-surfaces/input-and-editing
    - software-engineering/ui-surfaces/shell-and-navigation
    - software-engineering/llm-agent/companion
    - software-engineering/llm-agent/orchestration
    - software-engineering/engineering-assessment
  out_of_scope_subjects:
  directions_ledger: .ai/directions/ledger.jsonl
