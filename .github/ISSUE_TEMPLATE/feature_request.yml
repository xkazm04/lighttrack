name: Feature request
description: Propose a capability, an integration, or a change to how something works.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: `docs/ROADMAP.md` says what is already planned, and `docs/DECISIONS.md`
        records trade-offs that are already settled. If your idea contradicts one of those, say so
        and why — that is a fine argument to make, just make it explicitly.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that LightTrack makes hard or impossible today? Describe the
        situation, not the solution — the solution goes in the next box.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The change you have in mind. A rough API sketch or example config helps.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Observability (events, traces, ingest)
        - Judge / scoring / rubrics
        - Benchmarks & datasets
        - Cost, pricing, margin
        - Usage limits & governance
        - Store backends (SQLite / Postgres / Firestore)
        - MCP server
        - CLI
        - Client SDKs (Python / TypeScript / Rust)
        - Deployment & packaging (container, Helm, Terraform)
        - Docs
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: >
        Including "I worked around it by …" — a workaround that already exists is useful signal about
        how urgent this is.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
          required: false
