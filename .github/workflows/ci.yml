name: ci

# Test + lint gate on every push / PR to main. The other workflows (docker.yml, release.yml) are
# tag-triggered and never run the suite, so a regression could merge with a fully red set of
# conformance / margin / pricing / billing / judge tests. This is the safety net that catches it
# before merge instead of after deploy.
#
# The store conformance::run contract is exercised against ALL THREE backends here: in-memory SQLite,
# an ephemeral Postgres service container, and the Firestore emulator. Before, only SQLite ran (the
# Postgres/Firestore tests are env-gated and skipped), so a codec or ORDER-BY divergence in the cloud
# backends could ship undetected. Now each backend is its own required check.
#
# ── SHIP INVENTORY → GATING JOB ───────────────────────────────────────────────────────────────────
# `cargo test --workspace` quantifies over the MEMBERS LIST in the root Cargo.toml, not over the
# checkout, and it omits by default: nothing warns when a directory is not in it. So every artifact
# that leaves this repository is listed here against the job that actually compiles and runs it.
# Adding a shipped artifact means adding a row AND a job; a row reading "none" is a coverage hole,
# not a note.
#
#   artifact                                  gated by
#   ----------------------------------------  ----------------------------------------------------
#   the 6 workspace binaries (api, runner,     `test` (+ `clippy`, `fmt`) — cargo workspace members
#     mcp, cli, agent, responder) + libs
#   clients/rust  (detached cargo workspace)   `clients-rust`
#   clients/python (pip package)               `clients-python`
#   clients/typescript (npm package)           `clients-typescript`
#   the container image                        docker.yml (build only — not a suite)
#   release binaries                           release.yml (tag-triggered build)
#   deploy/helm/lighttrack (the Helm chart)    `chart-policy`
#     ^ this row read "none" until 2026-09-03. The chart is the artifact a stranger runs against
#       their own cluster and nothing in CI had ever opened `deploy/`.
#
# The durable form of this is a check that walks the tree for package manifests and fails on any
# manifest no job names; until that exists, this written list is the honest interim, and it is
# carried here — beside the jobs — rather than in a doc, so it is read when the jobs are edited.
#
# ── THE GATE TABLE IS DERIVED, NOT COPIED ─────────────────────────────────────────────────────────
# CONTRIBUTING.md publishes a "Job (check name) | Blocking" table. It used to be a hand-copy, and it
# had drifted. `crates/core/tests/gate_table_guard.rs` now reads THIS FILE and that table and fails
# `cargo test --workspace` on any disagreement — a job with no row, a row with no job, or a Blocking
# column that contradicts `continue-on-error:` here. Renaming a `name:` below therefore breaks the
# suite until the doc follows, which is the point: these strings are also what branch protection
# names as required checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly sweep for the `deny-advisories` job only — every other job here is a pure function of the
  # commit and learns nothing from being re-run on unchanged code. The advisory database is the
  # exception: a RUSTSEC entry can be published against a dependency we already ship, days after our
  # last commit, and a push-only trigger would never notice. Each sibling job is gated off on this
  # event (see `if:` below) so the cron costs one runner, not eleven. Note that `deny-policy` — the
  # deterministic half of the same tool — is gated off with the rest: its verdict is fixed by
  # Cargo.lock, so a Monday re-run on an unchanged commit could only repeat Friday's answer.
  # NB: GitHub disables scheduled workflows on a public repo after 60 days without a commit.
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

# A newer push to the same ref supersedes in-flight runs (rapid pushes, PR force-updates).
# `github.event_name` is part of the key so the Monday cron gets its own group: it shares
# `refs/heads/main` with pushes to main, and without this a scheduled run landing mid-push would
# cancel real CI (`cancel-in-progress` cuts both ways). Push and pull_request already differ by ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Required check ────────────────────────────────────────────────────────────────────────────
  # The in-memory SQLite conformance suite: no external infra, deterministic, fast. This is the gate
  # that must stay green to merge — mark `sqlite conformance (required)` as a required status check in
  # the branch-protection rules for main. (rusqlite is `bundled`, so this job needs no system libs.)
  conformance:
    name: sqlite conformance (required)
    # Nothing to learn from re-running the suite on an unchanged commit — the Monday cron exists for
    # `cargo-deny` alone. (Only skipped on `schedule`, so required-check status on PRs is untouched.)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo test -p lighttrack-store --test sqlite_conformance

  # ── Required check ────────────────────────────────────────────────────────────────────────────
  # Same conformance::run, but against a real **ephemeral Postgres** so the cloud backend (store-pg)
  # is held to the identical contract — codec round-trips, ON CONFLICT upserts, the FOR UPDATE SKIP
  # LOCKED job claim, and the fixed-width RFC3339(Nanos,Z) timestamp invariant that range filters /
  # ORDER BY depend on. The service container is fresh per run (empty DB); the suite is also safe on a
  # non-empty one. Mark `postgres conformance (required)` as a required status check for main.
  pg-conformance:
    name: postgres conformance (required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lighttrack
        ports:
          - 5432:5432
        # Gate the job's steps on the DB actually accepting connections, not just the container start.
        options: >-
          --health-cmd "pg_isready -U postgres -d lighttrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # PgStore::connect uses sslmode=prefer → plaintext fallback for this non-TLS local container.
      LIGHTTRACK_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lighttrack
    steps:
      - uses: actions/checkout@v4
      # store-pg links native-tls (system OpenSSL); needed even against a plaintext local DB to build.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo test -p lighttrack-store-pg --test conformance

  # ── Required check ────────────────────────────────────────────────────────────────────────────
  # Same conformance::run against the **Firestore emulator** so store-firestore stays behaviorally
  # identical to SQLite/Postgres. The emulator needs no auth (FIRESTORE_EMULATOR_HOST short-circuits
  # the bearer token in FirestoreStore::connect) and accepts any project id. It is a Java process
  # started by gcloud, so this job provisions a JDK + the cloud-firestore-emulator component, launches
  # it in the background, and waits for the port before testing. Mark this required for main too.
  firestore-conformance:
    name: firestore conformance (required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      LIGHTTRACK_TEST_FIRESTORE: firestore://demo
    steps:
      - uses: actions/checkout@v4
      # store-firestore's reqwest uses native-tls (system OpenSSL) on Linux — required to build.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # The current gcloud Firestore emulator requires a Java 21+ JRE (it refuses to start on 17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Set up gcloud + Firestore emulator
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: cloud-firestore-emulator
      - name: Start Firestore emulator
        run: |
          nohup gcloud emulators firestore start --host-port=127.0.0.1:8080 \
            > "${RUNNER_TEMP}/firestore-emulator.log" 2>&1 &
          # The emulator answers 200 "Ok" on / once ready; poll it before handing off to the suite.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Firestore emulator is up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "::error::Firestore emulator did not become ready"; cat "${RUNNER_TEMP}/firestore-emulator.log"; exit 1
      - run: cargo test -p lighttrack-store-firestore --test conformance

  # ── Required check ────────────────────────────────────────────────────────────────────────────
  # Policy over the deployment SHAPE: `crates/core/tests/chart_policy_guard.rs` reads
  # `deploy/helm/lighttrack/` as text and fails on a chart that grants what it must never grant —
  # a templated replica count with no `{{ fail }}` guard behind it (two writers on one SQLite file),
  # a missing update strategy, a BestEffort pod, a root uid, a mounted ServiceAccount token, both
  # kubelet probes tidied back onto one path. It carries its own must-fail fixtures: every policy
  # has a scratch chart that trips it, because a policy that cannot fail is a comment with an exit
  # code.
  #
  # It needs no helm binary, no cluster and no new toolchain — it is `cargo test`, like the two
  # sibling guards that read the CI workflow and the AI manifest. It is its own job rather than a
  # line inside `cargo test --workspace` so branch protection can name it, and so a red here says
  # "the chart regressed" instead of "some test failed".
  chart-policy:
    name: chart policy (required)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ruler is pinned by rust-toolchain.toml (one address, repo root).
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo test -p lighttrack-core --test chart_policy_guard

  # ── Full workspace suite ──────────────────────────────────────────────────────────────────────
  # Everything: conformance + margin + pricing + billing + judge + store/api/engine unit tests.
  # Blocking — keep this required alongside the conformance job.
  test:
    name: cargo test --workspace
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # store-pg links native-tls (system OpenSSL); cloud Postgres like Neon needs TLS. No live DB is
      # required to build/run the suite — store-pg uses runtime queries (no compile-time sqlx macros).
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo test --workspace

  # The Rust SDK is a DETACHED cargo project (its own empty `[workspace]`), depending on
  # lighttrack-core by path. `cargo test --workspace` above therefore never touches it — which is
  # precisely how it drifted out of compiling when core's Score and LlmEvent gained fields. It is a
  # shipped artifact, so CI has to exercise it or nothing will.
  clients-rust:
    name: cargo test (rust sdk)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # reqwest pulls native-tls here too.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      - run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust
          shared-key: clients-rust
      - run: cargo test --manifest-path clients/rust/Cargo.toml

  # The Python SDK is out of graph in a way that is *less* visible than the Rust one: no cargo
  # command was ever going to reach it, so there was not even a near-miss to notice. It is a shipped
  # artifact (`pip install`), it has a real suite its README tells contributors to run — and until
  # this job, no CI run invoked it. Same shape as the clients/rust drift above; the fix is the same,
  # a job of its own named after the artifact.
  #
  # Two halves, deliberately:
  #   build — `pip install ./clients/python` runs the hatchling backend over pyproject.toml, so a
  #     wrong `[tool.hatch.build.targets.wheel] packages` list or broken metadata fails here rather
  #     than at publish time. Compiling is not exercising, and packaging is not compiling.
  #   run  — `discover -s clients/python/tests` puts ONLY that directory on sys.path, so
  #     `import lighttrack` resolves to the wheel that was just installed, not to the adjacent
  #     source tree. Running from `clients/python` (what the README documents for humans) would
  #     shadow the install with the source dir and gate a different thing.
  clients-python:
    name: python suite (python sdk)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pyproject declares `requires-python = ">=3.8"`; this pins the one version CI proves.
          python-version: "3.11"
          # No `cache: pip` on purpose: the client declares zero runtime dependencies (stdlib only),
          # so there is nothing to restore and a cache key would only add a step that can go stale.
      - name: Build and install the wheel
        run: python -m pip install ./clients/python
      - name: Run the suite against the installed wheel
        run: python -m unittest discover -s clients/python/tests -v

  # The TypeScript SDK, same story: a shipped npm package with a `test` script that no job ran.
  clients-typescript:
    name: npm test (typescript sdk)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # tsx and esbuild both declare `engines: node >=18`; 20 is the LTS we prove against.
          node-version: "20"
          # Scope the cache to this project's OWN lockfile — the detached client resolves its own
          # dependency graph and must not share a key with anything else in the repo. (The cargo
          # equivalent is `workspaces: clients/rust` + `shared-key: clients-rust` on the job above.)
          # This path is relative to the workspace root, not to `working-directory`.
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      # `tsc -p tsconfig.json` — the build that produces the published `dist/`, and (because
      # tsconfig `include`s all of `src`) a `strict` typecheck of the test files as well.
      - run: npm run build
      # `tsx --test src/*.test.ts` — the suite as package.json declares it.
      - run: npm test
      # Compiling is not exercising. `npm test` runs tsx over `src/`; it never loads the emitted
      # `dist/`, which is what `main`/`exports` point consumers at. So load the published entry
      # point the way a consumer does and assert the class is really exported — a rootDir/outDir
      # slip or an exports-map typo that leaves `dist` unloadable passes every step above.
      - name: Smoke the published entry point
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.LightTrack !== 'function') throw new Error('dist/index.js does not export LightTrack'); console.log('dist entry point loads'); })"

  # ── Required checks ───────────────────────────────────────────────────────────────────────────
  # Both gates are BLOCKING. The pre-existing fmt/clippy debt these jobs were once advisory for is
  # gone: the tree is stock-rustfmt clean and `clippy -D warnings` passes workspace-wide across all
  # targets. Keeping them advisory now would only let the debt come back. Mark
  # `cargo clippy -D warnings` and `cargo fmt --check` as required status checks for main.
  #
  # There is deliberately no `rustfmt.toml` — stock defaults, so plain `cargo fmt` locally produces
  # exactly what this job checks. Do not add one without changing this comment.
  #
  # 2026-08-24, correction: "deterministic given the tree" was NOT true of these two, because
  # `dtolnay/rust-toolchain@stable` FLOATS — the same commit checked next month could be judged by a
  # different rustfmt and a different clippy, which is the one property that disqualifies a gate from
  # blocking. Observed, not theorized: on that date `cargo fmt --check` went red on six untouched
  # files under rustfmt 1.9.0-stable, on a tree nobody had changed.
  #
  # 2026-08-24, resolved (same day, later wave): `rust-toolchain.toml` now pins the channel, and
  # every job in this file dropped its `dtolnay/rust-toolchain@stable` step. Nothing here names a
  # Rust version: cargo is invoked through rustup, which reads the pin file and installs exactly
  # what it says. These gates are functions of the commit again. A Rust bump is now a one-line diff
  # to that file, and the fmt/clippy churn it causes lands in the bump commit instead of ambushing
  # an unrelated PR. Do not reintroduce a toolchain step here — that would give the pin two
  # addresses, and the workflow's would silently win for the tools it installs.
  clippy:
    name: cargo clippy -D warnings
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      # Prints the clippy the gate is actually run with — the pinned one, from rust-toolchain.toml.
      - run: cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: cargo fmt --check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ruler is pinned by rust-toolchain.toml (one address, repo root). rustup ships on the
      # runner image and reads that file on the first cargo invocation, installing exactly the
      # pinned toolchain + components — so no job here names a version that could drift from it.
      # Prints the rustfmt the gate is actually run with — the pinned one, from rust-toolchain.toml.
      - run: cargo fmt --version
      - run: cargo fmt --all -- --check

  # ── Supply chain ──────────────────────────────────────────────────────────────────────────────
  # `cargo deny` = RUSTSEC advisories + license allow-list + duplicate/wildcard bans + crate-source
  # pinning, configured in deny.toml at the repo root. Before it, the project had no automated view
  # of whether it was shipping a crate with a published CVE — for software that stores other
  # people's prompts and completions (SECURITY.md), that was the gap worth closing.
  #
  # This was ONE advisory job until 2026-08-24, when the split its own TIGHTEN-IT-WHEN called for
  # was carried out. The reasoning, kept because the next maintainer will be tempted to re-litigate
  # it on severity: advisory-vs-blocking is decided by whether the verdict is a function of THIS
  # repository's contents, not by how serious the findings sound. `check all` bundled four checks
  # of two different kinds behind one command, so the whole thing inherited the weakest grade and
  # three deterministic checks went unenforced. Splitting grades each half on its own input.
  #
  # Both jobs use the upstream action rather than the `dtolnay/rust-toolchain` + `cargo …` idiom the
  # rest of this file follows, because cargo-deny is not part of the toolchain: `cargo install
  # cargo-deny` is a ~2.5 min from-source build that `Swatinem/rust-cache` does not cache (it
  # installs to ~/.cargo/bin, not target/). The action ships a prebuilt binary. Same precedent as
  # setup-java / setup-gcloud / action-gh-release elsewhere in this repo: purpose-built action for
  # non-cargo tooling, pinned to a major tag.

  # ── Required check ────────────────────────────────────────────────────────────────────────────
  # BLOCKING. Its input is Cargo.lock: bans, licenses and sources can only change verdict when *we*
  # change dependencies, so a failure here is always attributable to the change being gated and is
  # always fixable inside the PR that caused it. Verified green on the tree at the time of the
  # promotion (2026-08-24: `bans ok, licenses ok, sources ok`), so this blocks from day one with no
  # debt period. Mark `cargo deny (policy)` as a required status check for main.
  #
  # Gated off `schedule` like every other deterministic job: re-running it Monday on an unchanged
  # commit could only reproduce the same answer.
  deny-policy:
    name: cargo deny (policy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
          # Replaces the action's default `--all-features` (a no-op here — no workspace crate
          # declares a `[features]` table). `--locked` is the point: scan the dependency graph that
          # is actually committed, and fail loudly if Cargo.lock is stale rather than silently
          # auditing a resolved-on-the-fly graph that nobody ships.
          arguments: --locked

  # ── Required check ────────────────────────────────────────────────────────────────────────────
  # BLOCKING, and this is the rung where a leaked credential cannot pass. The remote is PUBLIC and
  # this product stores other people's prompts and completions (SECURITY.md); until 2026-08-24
  # nothing here read a diff or the history for credentials at all.
  #
  # It scans the FULL HISTORY, not the diff: 241 commits in ~7 seconds, so the "scan the diff at
  # commit, sweep the history on a schedule" split that exists to protect a latency budget buys
  # nothing at this size. `.githooks/pre-commit` still scans the staged diff locally for the fast
  # answer, but it announces a skip when gitleaks is absent — punishing a fresh clone teaches bypass.
  # This job is the rung the author cannot skip, on a runner that installs the engine itself.
  #
  # The gitleaks VERSION IS PINNED, for the same reason rust-toolchain.toml pins rustc: a scanner's
  # verdict is a function of (this repo) × (its rule set), and an unpinned engine makes a blocking
  # gate non-deterministic across time — the property that disqualifies a gate from blocking. New
  # upstream rules reach old history through the advisory cron job below, and through a reviewable
  # one-line bump here.
  #
  # Armed clean: the rule set was driven over the whole tree and all of history before this job
  # existed. One finding, a false positive (an entropy hit on `min_cost=0.25` beside a variable
  # named `key`), fingerprinted in `.gitleaksignore`. There is no baseline file because the
  # repository has never committed a credential — this gates on zero because zero is where it starts.
  secrets:
    name: gitleaks (secrets)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      # The pin. Bumping it is the moment new upstream rules get applied to old history.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone would scan a truncated history and pass on a token pushed last spring.
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # `--redact` so a finding names its file and rule in a PUBLIC log without republishing the
      # secret it just found.
      - run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  # NON-BLOCKING, on the Monday cron only — the secret-scanning twin of `deny-advisories`, graded on
  # the same axis. Its input is gitleaks' UPSTREAM rule set, which moves without this repository: a
  # detection pattern published next month should find a token pushed last spring, and the blocking
  # job above deliberately cannot see it because its engine is pinned. So the newest rules get run
  # over the whole history here, where a new upstream heuristic firing on old fixture data reports
  # to a human instead of walling unrelated work. Findings are triaged into `.gitleaksignore` (as
  # fingerprints) or fixed by rotation; a clean run for a while is the signal to bump the pin above.
  secrets-latest:
    name: gitleaks (latest rules, advisory)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (latest)
        run: |
          url=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest             | grep -o 'https://[^"]*linux_x64.tar.gz')
          curl -sSfL -o /tmp/gitleaks.tar.gz "$url"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  # NON-BLOCKING, and permanently so — this is not a debt schedule waiting on a cleanup. Its input
  # is the RUSTSEC database, which moves without us: an entry published overnight against a
  # transitive dependency would wall every unrelated PR until someone lands a bump. No amount of
  # work on this tree retires that property, so "revisit later" would be a promise nobody can
  # discharge. For a one-maintainer project, a red board for everyone is the wrong trade.
  #
  # Its findings are real and someone has to read them: this is the job the Monday cron above
  # exists for, and an advisory job nobody reads is not a supply-chain check at all. As of
  # 2026-08-24 it is RED on `h2` (unbounded empty DATA frames) awaiting an upstream bump — which is
  # exactly the finding that would have walled unrelated work had the old bundled job been promoted
  # whole instead of split.
  deny-advisories:
    name: cargo deny (advisories, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --locked
