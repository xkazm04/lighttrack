name: release

# Build the LightTrack binaries for each platform on a `v*` tag and attach them to the GitHub
# Release (consumed by deploy/install.sh / install.ps1). Hand-rolled equivalent of cargo-dist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at the top, write granted per JOB where it is actually used.
#
# This file used to grant `contents: write` workflow-wide, so every step in every job — including
# `cargo build`, which runs build scripts and proc macros from the whole dependency graph — ran with
# a token that could rewrite this repository's contents. Only two things here need write: attaching
# the archives to the release (`build`) and uploading the signature bundles (`sign`). `verify` needs
# nothing but a read.
#
# A job that declares `permissions:` gets EXACTLY that set (everything unnamed becomes `none`), so
# each block below is complete rather than additive.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # softprops/action-gh-release attaches dist/* to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,   archive: zip }
          - { os: macos-latest,    target: aarch64-apple-darwin,     archive: tar.gz }
          # Intel macOS: `macos-13` was RETIRED in Dec 2025, so every tag from v0.0.2 on sat in the
          # queue until the 24h limit cancelled the whole run — which is why no release before this
          # one carries an x86_64-apple-darwin asset. `macos-15-intel` is GitHub's named x86_64
          # replacement. It is the last Intel image: it goes away in Aug 2027, after which this leg
          # must either drop or cross-compile from an arm64 runner.
          - { os: macos-15-intel,  target: x86_64-apple-darwin,      archive: tar.gz }
    runs-on: ${{ matrix.os }}
    # Bounds a *hung build* (wedged linker, stuck test). It does NOT bound time spent waiting for a
    # runner — that is a separate 24h queue limit — so this is a backstop, not the fix for the above.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (sqlx native-tls + bundled sqlite)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p lighttrack-cli -p lighttrack-runner -p lighttrack-mcp -p lighttrack-api

      # Boot the binary we are about to publish and drive the real core loop through it. Cheap
      # (~10s) and it runs on the one leg whose artifact is also what the Docker image ships, so a
      # binary that cannot start, cannot open its DB, or cannot price an event never reaches a
      # release page. An artifact CI does not exercise is presumed broken.
      - name: Smoke the built binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          LIGHTTRACK_ADMIN_KEY: smoke-admin-key
        run: |
          LIGHTTRACK_BIND=127.0.0.1:8787 \
          LIGHTTRACK_AUTH_MODE=enforced \
          LIGHTTRACK_DB="$RUNNER_TEMP/smoke.db" \
          "target/${{ matrix.target }}/release/lighttrack-api" &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          sh scripts/smoke.sh http://127.0.0.1:8787

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/lighttrack-${{ matrix.target }}.tar.gz" \
            lt lt-runner lt-mcp lighttrack-api

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $r = "target/${{ matrix.target }}/release"
          Compress-Archive -Force -DestinationPath "dist/lighttrack-${{ matrix.target }}.zip" `
            -Path "$r/lt.exe","$r/lt-runner.exe","$r/lt-mcp.exe","$r/lighttrack-api.exe"

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  # Supply chain: a signature and an SBOM for what this tag actually published.
  #
  # Keyless (Fulcio/Rekor). The signing identity is this workflow's OIDC token — repository, ref and
  # workflow path — so there is no private key to store, rotate or leak, and a verifier can pin to
  # exactly this workflow rather than to "somebody who had the key". See SECURITY.md for the
  # `cosign verify-blob` invocation.
  #
  # A SEPARATE JOB, after `build`, on purpose: the binaries are already attached to the release by the
  # time this runs. A failure here is loud and fixable by re-running the job, and it cannot stop a
  # release that otherwise succeeded — signing is a property added to the artifacts, not a gate the
  # artifacts have to pass.
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the SBOM and the signature bundles to the release
      id-token: write # the OIDC token IS the signing identity
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Build the SBOM for the source tree this tag was cut from
        env:
          TAG: ${{ github.ref_name }}
        run: syft dir:. -o "spdx-json=lighttrack-$TAG.spdx.json"

      - name: Sign every published artifact, and the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p signed
          cd signed
          # Re-running this job re-downloads the bundles it wrote last time; skip them below rather
          # than signing a signature.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'lighttrack-*' --clobber
          cp -f "../lighttrack-$TAG.spdx.json" .
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            echo "signing $f"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "lighttrack-$TAG.spdx.json" ./*.sigstore.json
          echo "signed:"; ls -1 ./*.sigstore.json

  # The defect behind the defect: with `fail-fast: false`, three legs can succeed and publish while a
  # fourth never runs, leaving a release that *looks* fine but silently has no binary for a platform
  # deploy/install.sh will happily ask for. This job makes that state loud instead of invisible.
  verify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Assert every platform artifact was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > /tmp/assets.txt
          echo "published assets:"; sed 's/^/  /' /tmp/assets.txt
          missing=0
          for a in lighttrack-x86_64-unknown-linux-gnu.tar.gz \
                   lighttrack-x86_64-pc-windows-msvc.zip \
                   lighttrack-aarch64-apple-darwin.tar.gz \
                   lighttrack-x86_64-apple-darwin.tar.gz; do
            grep -qxF "$a" /tmp/assets.txt || { echo "MISSING: $a" >&2; missing=1; }
          done
          [ "$missing" -eq 0 ] || {
            echo "release $TAG is incomplete — deploy/install.sh will 404 for the missing platform" >&2
            exit 1
          }
          echo "all four platform artifacts present"
