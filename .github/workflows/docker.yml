name: docker

# Build + publish the multi-arch image to GHCR on release tags or manual trigger.
# (Not on every push, to avoid burning CI during active development.)
#
# amd64 and arm64 build on their own NATIVE runners in parallel (no QEMU — an
# emulated arm64 Rust build of the whole workspace is far too slow). Each leg
# pushes a by-digest image; the `merge` job then stitches them into one
# manifest list tagged v<x> / sha-<sha> / latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build a LOCAL single-platform image first, so we can actually run it. This is the leg that
      # compiles (and populates the cache); the push step below is a cache hit that only uploads.
      # `load: true` works here precisely because each matrix leg is on a runner NATIVE to its arch —
      # a multi-arch manifest could not be loaded into the daemon, and emulating arm64 would be
      # unusably slow.
      - name: Build image locally (for smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: lighttrack:smoke
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Run the image and drive the real core loop through it. Nothing is pushed until this passes,
      # so a broken image can never acquire a tag — previously the image was published with zero
      # post-build verification of any kind.
      - name: Smoke the built image
        env:
          LIGHTTRACK_ADMIN_KEY: smoke-admin-key
        run: |
          set -eu
          cid=$(docker run -d -p 127.0.0.1:8787:8787 \
            -e LIGHTTRACK_AUTH_MODE=enforced \
            -e LIGHTTRACK_ADMIN_KEY="$LIGHTTRACK_ADMIN_KEY" \
            lighttrack:smoke)
          trap 'echo "--- container logs ---"; docker logs "$cid" 2>&1 || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sh scripts/smoke.sh http://127.0.0.1:8787

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # Push by digest only; the merge job assigns the human-readable tags.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Cache was written by the smoke build above; this step is a hit that only uploads layers.
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the OIDC token is the identity, so there is no key to leak
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      # Supply chain: sign the manifest list and attest an SBOM against the same digest.
      #
      # Keyless (Fulcio/Rekor) — the signature's identity is this workflow's OIDC token (repository,
      # ref, workflow path), so nothing has to hold a private key and a verifier can pin to exactly
      # this workflow instead of to "whoever had the key". SECURITY.md carries the `cosign verify`
      # invocation for the published image.
      #
      # Signing the DIGEST, not a tag: a tag is a moving pointer, and a signature over a name that can
      # be repointed proves nothing about the bytes anyone actually pulled.
      #
      # Last in the job on purpose. The manifest list is already pushed by the time this runs, so a
      # failure here is loud and re-runnable without ever unpublishing a tag.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Sign the image and attest its SBOM
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{ json .Manifest }}' | jq -r .digest)
          [ -n "$digest" ] && [ "$digest" != "null" ] || {
            echo "could not resolve a digest for $IMAGE:$VERSION" >&2; exit 1; }
          echo "signing $IMAGE@$digest"
          cosign sign --yes "$IMAGE@$digest"
          syft "$IMAGE@$digest" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$digest"
