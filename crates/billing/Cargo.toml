[package]
name = "lighttrack-billing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Billing-provider adapters (Stripe/Polar) → normalized RevenueEvents for profit tracking."

[dependencies]
lighttrack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"

[dev-dependencies]
# The one process-wide lock for tests that write the environment (lighttrack_core::test_env).
lighttrack-core = { workspace = true, features = ["test-env"] }
