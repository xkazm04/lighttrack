[package]
name = "lighttrack-responder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local reactive responder: on a LightTrack error-spike webhook, runs Claude Code (read-only) against the mapped repo and writes a diagnosis."

[[bin]]
name = "lt-responder"
path = "src/main.rs"

[dependencies]
# For `FailureClass` alone: the wire vocabulary of the class the producer minted has ONE address, so
# this crate cannot grow a second, subtly different one beside the ingest boundary's.
# The one headless-Claude invocation seam (posture, spawn, envelope, probe, bin resolution).
lighttrack-engine = { path = "../engine" }
# The alert-signature contract. The API SIGNS with this same code — see
# `lighttrack_core::alert_sign` for why one implementation is the only workable number.
lighttrack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["full"] }
axum = "0.7"
anyhow = "1"
# Fetch failing events from LightTrack for context enrichment.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "system-proxy"] }
# Render the diagnosis Markdown to HTML for the email body (email clients don't render Markdown).
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
