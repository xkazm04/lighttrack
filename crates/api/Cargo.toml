[package]
name = "lighttrack-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightTrack ingest + query REST service (axum). Local box → Cloud Run."

[dependencies]
lighttrack-core.workspace = true
lighttrack-store = { path = "../store" }
lighttrack-store-pg = { path = "../store-pg" }
lighttrack-store-firestore = { path = "../store-firestore" }
# Reuse the regex PII scrubber for optional content redaction on ingest.
lighttrack-anon = { path = "../anon" }
# Billing-provider webhook verification + normalization (Stripe/Polar).
lighttrack-billing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["full"] }
axum = "0.7"
anyhow = "1"
sha2 = "0.10"
# Constant-time secret comparison (admin key, key digests). Already in this crate's dependency graph
# via sha2 -> digest, so declaring it directly costs no extra build or supply-chain surface.
subtle = "2"
# Outbound HTTP for breach-alert delivery (webhook / ntfy). Default TLS (SChannel/OpenSSL).
reqwest = { version = "0.13", features = ["json"] }
# Structured diagnostics. `tracing` was already in this crate's dependency graph (tokio/reqwest emit
# through it); declaring it directly plus a subscriber is what turns those events into output.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
    "json",
    "ansi",
] }

[dev-dependencies]
# Drives the wired axum Router end-to-end in integration tests via `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }
