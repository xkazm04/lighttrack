[package]
name = "lighttrack-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightTrack persistence: Store trait + SQLite backend (local). BigQuery backend later."

[dependencies]
lighttrack-core.workspace = true
# M24: a server-side dataset import mines production text, and that text is scrubbed on the way in
# (see dataset_import) rather than by whichever caller happens to remember to.
lighttrack-anon = { path = "../anon" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
# The store measures itself (see sqlite::metrics) and reports slow operations on the SAME structured
# log the API already emits — one telemetry model for the process, not a second private channel.
tracing = "0.1"

[dev-dependencies]
# File-backed scratch databases: the read pool and WAL only exist off `:memory:`.
tempfile = "3"
# A dev-only dependency cycle (cargo permits one): `tests/parity_doc.rs` renders docs/PARITY.md from
# all three backends' manifests, and a manifest belongs beside the `impl Store` it describes rather
# than copied in here, where it would drift from the code it claims to document. Each is a pure
# associated function, so the doc test needs no live database.
lighttrack-store-pg = { path = "../store-pg" }
lighttrack-store-firestore = { path = "../store-firestore" }
