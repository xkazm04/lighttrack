[package]
name = "lighttrack-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightTrack persistence: Store trait + SQLite backend (local). BigQuery backend later."

[dependencies]
lighttrack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
# The store measures itself (see sqlite::metrics) and reports slow operations on the SAME structured
# log the API already emits — one telemetry model for the process, not a second private channel.
tracing = "0.1"

[dev-dependencies]
# File-backed scratch databases: the read pool and WAL only exist off `:memory:`.
tempfile = "3"
